# Render blueprint for Udgam 2K26 — website + API as ONE free web service.
#
# Render Dashboard -> New -> Blueprint -> pick this repo, set "Blueprint Path" to
# backend/render.yaml, then fill in the values marked `sync: false`.
#
# Why one service: Render's free plan has 750 instance-hours per workspace per month; one
# service awake 24/7 uses ~744 h. The Express server in backend/ serves the API (/api, /health)
# AND the website (built with NITRO_PRESET=node-middleware), so everything stays free and awake.
services:
  - type: web
    name: udgam
    runtime: node
    plan: free
    # no rootDir: the build needs both frontend/ and backend/
    buildCommand: >-
      cd frontend && npm ci && NITRO_PRESET=node-middleware npm run build &&
      cd ../backend && npm ci && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # the website is served by this same server (path relative to backend/)
      - key: WEBSITE_SERVER_ENTRY
        value: ../frontend/.output/server/index.mjs
      - key: REGISTRATIONS_OPEN
        value: "false"
      - key: BACKUP_INTERVAL_MINUTES
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: BACKUP_SYNC_TOKEN
        generateValue: true
